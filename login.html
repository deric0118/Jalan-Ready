<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SIRCa Command Center</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="frontend/css/style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            selangor: { red: '#C8102E', gold: '#F5A623', redDark:'#9B0B22' },
            sirca: { navy: '#0B1829', blue: '#0D2A4A', steel: '#1E3A5F', accent: '#0EA5E9' }
          },
          fontFamily: { display: ['Rajdhani', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    /* 登录页专属动画与样式 */
    .auth-bg {
      background: radial-gradient(circle at top right, #1E3A5F 0%, #0B1829 60%);
    }
    .auth-card {
      animation: fadeSlideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .input-field {
      width: 100%; padding: 12px 16px 12px 40px;
      background: #F8FAFC; border: 1px solid #E2E8F0;
      border-radius: 10px; font-size: 14px;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      outline: none; border-color: #0EA5E9; background: #ffffff;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); color: #94A3B8; font-size: 14px;
    }
  </style>
</head>

<body class="font-body auth-bg text-slate-800 min-h-screen flex items-center justify-center relative overflow-hidden">

  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-selangor-red via-selangor-gold to-selangor-red opacity-80"></div>
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-sirca-accent opacity-10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-selangor-red opacity-10 rounded-full blur-3xl"></div>

  <div class="sirca-card auth-card w-full max-w-md relative z-10 p-8 shadow-2xl">
    
    <div class="flex flex-col items-center justify-center mb-8">
      <div class="relative w-14 h-14 mb-3">
        <div class="absolute inset-0 rounded-xl bg-selangor-red opacity-20 animate-pulse-slow"></div>
        <div class="relative flex items-center justify-center w-14 h-14 rounded-xl bg-selangor-red/10 border border-selangor-red/40">
          <i class="fa-solid fa-road text-selangor-red text-2xl"></i>
        </div>
      </div>
      <h1 class="font-display text-3xl font-bold tracking-wider text-sirca-navy">SIRCa</h1>
      <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Command Center Access</p>
    </div>

    <div class="flex p-1 mb-6 bg-slate-100 rounded-lg">
      <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-md shadow-sm bg-white text-sirca-navy transition-all">Login</button>
      <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">Sign Up</button>
    </div>

    <form id="form-login" class="space-y-4">
      <div class="relative">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input id="login-email" name="email" type="email" placeholder="Email Address" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-lock input-icon"></i>
        <input id="login-password" name="password" type="password" placeholder="Password" class="input-field" required />
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center text-slate-500 cursor-pointer">
          <input type="checkbox" class="mr-2 rounded border-slate-300 text-sirca-accent focus:ring-sirca-accent" checked>
          Remember me
        </label>
        <a href="#" class="text-sirca-accent hover:underline font-medium">Forgot Password?</a>
      </div>
      <button type="submit" class="dispatch-btn w-full mt-2 py-3 rounded-xl shadow-lg">
        Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
      </button>
      <p id="login-message" class="text-sm text-slate-500 min-h-5"></p>
    </form>

    <form id="form-register" class="space-y-4 hidden">
      <div class="relative">
        <i class="fa-solid fa-user input-icon"></i>
        <input id="register-name" name="name" type="text" placeholder="Name (same as IC)" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input id="register-email" name="email" type="email" placeholder="Email Address" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-phone input-icon"></i>
        <input id="register-phone-number" name="phone_number" type="tel" placeholder="Phone Number" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-id-card input-icon"></i>
        <input id="register-id-number" name="id_number" type="text" placeholder="IC Number or Passport Number" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-location-dot input-icon"></i>
        <input id="register-address" name="address" type="text" placeholder="Address" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-map-pin input-icon"></i>
        <input id="register-postcode" name="postcode" type="text" placeholder="Postcode" class="input-field" required />
      </div>
      <div class="relative">
        <i class="fa-solid fa-lock input-icon"></i>
        <input id="register-password" name="password" type="password" placeholder="Create Password" class="input-field" required />
      </div>
      <button type="submit" class="dispatch-btn w-full mt-2 py-3 rounded-xl shadow-lg" style="background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);">
        Create Account <i class="fa-solid fa-user-plus ml-2"></i>
      </button>
      <p id="register-message" class="text-sm text-slate-500 min-h-5"></p>
    </form>

    <div class="mt-8 text-center text-xs text-slate-400">
      &copy; 2026 Selangor Intelligent RoadCare.<br>Restricted Gov-Tech Portal.
    </div>
  </div>

  <script type="module" src="frontend/js/auth.js"></script>
</body>
</html>
