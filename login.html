<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jalan-Ready · Command Center Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: linear-gradient(145deg, #0B1829 0%, #0D2A4A 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .input-field {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.2s;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.12);
      border-color: #C8102E;
      outline: none;
    }
    .btn-primary {
      background: #C8102E;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #9B0B22;
      transform: translateY(-1px);
    }
    .tab-active {
      border-bottom: 2px solid #C8102E;
      color: white;
    }
    .tab-inactive {
      color: #94A3B8;
    }
    .error-text {
      color: #f87171;
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="glass-card rounded-3xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-selangor-red/20 mb-4">
        <i class="fa-solid fa-road text-selangor-red text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Jalan-Ready</h1>
      <p class="text-slate-400 text-sm mt-1">Selangor Intelligent RoadCare</p>
    </div>

    <div class="flex gap-6 border-b border-white/10 mb-6">
      <button id="loginTab" class="pb-2 text-sm font-semibold transition tab-active">Login</button>
      <button id="signupTab" class="pb-2 text-sm font-semibold text-slate-400 transition">Sign Up</button>
    </div>

    <div id="loginForm" class="space-y-4">
      <div>
        <label class="block text-slate-300 text-sm mb-1">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" class="input-field w-full rounded-xl px-4 py-3 text-white placeholder:text-slate-500">
      </div>
      <div>
        <label class="block text-slate-300 text-sm mb-1">Password</label>
        <input type="password" id="loginPassword" placeholder="········" class="input-field w-full rounded-xl px-4 py-3 text-white">
      </div>
      <div class="flex justify-between items-center text-sm">
        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" class="rounded bg-white/10"> Remember me</label>
        <a href="#" class="text-selangor-red hover:underline">Forget Password?</a>
      </div>
      <button id="doLogin" class="btn-primary w-full py-3 rounded-xl text-white font-semibold mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Authenticate
      </button>
      <div id="loginError" class="error-text hidden text-center"></div>
    </div>

    <div id="signupForm" class="space-y-3 hidden">
      <div class="grid grid-cols-2 gap-3">
        <div><input type="text" id="signupName" placeholder="Full name" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
        <div><input type="email" id="signupEmail" placeholder="Email" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><input type="text" id="signupPhone" placeholder="Phone" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
        <div><input type="text" id="signupIc" placeholder="IC/Passport" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
      </div>
      <div><input type="text" id="signupAddress" placeholder="Address" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><input type="text" id="signupPostcode" placeholder="Postcode" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
        <div><input type="password" id="signupPassword" placeholder="Password" class="input-field w-full rounded-xl px-3 py-2 text-white text-sm"></div>
      </div>
      <button id="doSignup" class="btn-primary w-full py-3 rounded-xl text-white font-semibold mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Create account
      </button>
      <div id="signupError" class="error-text hidden text-center"></div>
    </div>

    <div class="text-center text-slate-500 text-xs mt-8 pt-4 border-t border-white/10">
      © 2026 Jalan-Ready. Restricted Gov‑Tech Portal.
    </div>
  </div>

  <script>
    // Switch between tabs
    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const loginFormDiv = document.getElementById('loginForm');
    const signupFormDiv = document.getElementById('signupForm');
    const loginError = document.getElementById('loginError');
    const signupError = document.getElementById('signupError');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('tab-active', 'text-white');
      loginTab.classList.remove('tab-inactive');
      signupTab.classList.remove('tab-active');
      signupTab.classList.add('tab-inactive');
      loginFormDiv.classList.remove('hidden');
      signupFormDiv.classList.add('hidden');
      loginError.classList.add('hidden');
      signupError.classList.add('hidden');
    });

    signupTab.addEventListener('click', () => {
      signupTab.classList.add('tab-active', 'text-white');
      signupTab.classList.remove('tab-inactive');
      loginTab.classList.remove('tab-active');
      loginTab.classList.add('tab-inactive');
      signupFormDiv.classList.remove('hidden');
      loginFormDiv.classList.add('hidden');
      loginError.classList.add('hidden');
      signupError.classList.add('hidden');
    });

    // Helper to show error
    function showError(container, message) {
      container.textContent = message;
      container.classList.remove('hidden');
      setTimeout(() => container.classList.add('hidden'), 5000);
    }

    // Detect backend URL
    const BACKEND_URL = 'http://127.0.0.1:8000';

    // LOGIN
    document.getElementById('doLogin').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) {
        showError(loginError, 'Please enter email and password.');
        return;
      }
      const btn = document.getElementById('doLogin');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
      btn.disabled = true;

      try {
        console.log(`[LOGIN] Attempting login for ${email} at ${BACKEND_URL}/api/login`);
        
        // Create abort controller with 30 second timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch(`${BACKEND_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        console.log(`[LOGIN] Response received. Status: ${response.status}`);

        // Check if response is actually JSON
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          console.error('[LOGIN] Invalid content type:', contentType);
          throw new Error('Backend not responding properly. Check if backend server is running on port 8000.');
        }

        const data = await response.json();
        console.log('[LOGIN] Response data:', data);
        
        if (!response.ok) throw new Error(data.detail || 'Login failed');
        
        // Store token and user info
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));
        console.log('[LOGIN] Token stored. Redirecting to frontend/index.html');
        
        // Redirect to main dashboard
        setTimeout(() => {
          window.location.href = './frontend/index.html';
        }, 500);
      } catch (err) {
        console.error('[LOGIN] Error:', err);
        let errorMsg = err.message;
        if (err.name === 'AbortError') {
          errorMsg = 'Request timeout (10 seconds). Backend server may not be running.';
        } else if (errorMsg.includes('Failed to fetch')) {
          errorMsg = 'Cannot reach backend server. Ensure it is running: python -m uvicorn backend.app:app --reload';
        }
        showError(loginError, errorMsg);
      } finally {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    });

    // SIGNUP
    document.getElementById('doSignup').addEventListener('click', async () => {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const ic = document.getElementById('signupIc').value.trim();
      const address = document.getElementById('signupAddress').value.trim();
      const postcode = document.getElementById('signupPostcode').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!name || !email || !phone || !ic || !address || !postcode || !password) {
        showError(signupError, 'All fields are required.');
        return;
      }
      const btn = document.getElementById('doSignup');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';
      btn.disabled = true;

      try {
        console.log(`[SIGNUP] Attempting signup for ${email} at ${BACKEND_URL}/api/signup`);
        
        // Create abort controller with 30 second timeout
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch(`${BACKEND_URL}/api/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone_number: phone, id_number: ic, address, postcode }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        console.log(`[SIGNUP] Response received. Status: ${response.status}`);

        // Check if response is actually JSON
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          console.error('[SIGNUP] Invalid content type:', contentType);
          throw new Error('Backend not responding properly. Check if backend server is running on port 8000.');
        }

        const data = await response.json();
        console.log('[SIGNUP] Response data:', data);
        
        if (!response.ok) throw new Error(data.detail || 'Signup failed');
        
        // Auto-login: store token and redirect
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));
        console.log('[SIGNUP] Account created. Redirecting to frontend/index.html');
        
        setTimeout(() => {
          window.location.href = './frontend/index.html';
        }, 500);
      } catch (err) {
        console.error('[SIGNUP] Error:', err);
        let errorMsg = err.message;
        if (err.name === 'AbortError') {
          errorMsg = 'Request timeout (10 seconds). Backend server may not be running.';
        } else if (errorMsg.includes('Failed to fetch')) {
          errorMsg = 'Cannot reach backend server. Ensure it is running: python -m uvicorn backend.app:app --reload';
        }
        showError(signupError, errorMsg);
      } finally {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    });

    // If already logged in, keep the login page visible.
    // This page should always show the login form first.
  </script>
</body>
</html>
